services:

  laravel-boilerplate:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ghcr.io/armandwipangestu/laravel-boilerplate-base:8.4-v1
    container_name: laravel-boilerplate
    env_file: .env
    volumes:
      - ./docker-data/storage:/var/www/storage
    logging:
      driver: "json-file"
      options:
        max-size: "500M"
        max-file: "3"

  db-laravel-boilerplate:
    image: postgres:17-bookworm
    container_name: db-laravel-boilerplate
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: laravel-boilerplate
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5435:5432"
    volumes:
      - ./docker-data/postgres:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-size: "500M"
        max-file: "3"

  pgadmin4-laravel-boilerplate:
    image: dpage/pgadmin4:9.10.0
    container_name: pgadmin4-laravel-boilerplate
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: laravel-boilerplate
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5051:80"
    volumes:
      - ./docker-data/pgadmin:/var/lib/pgadmin
    logging:
      driver: "json-file"
      options:
        max-size: "500M"
        max-file: "3"

  proxy-laravel-boilerplate:
    image: nginx:1.27-alpine
    container_name: proxy-laravel-boilerplate
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - laravel-boilerplate
    logging:
      driver: "json-file"
      options:
        max-size: "500M"
        max-file: "3"

